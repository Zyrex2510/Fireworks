<canvas id="scene"></canvas>
<div id="overlay">
  <h1>Pour toi... 💌</h1>
  <p>touch the night to begin</p>
</div>
<button id="soundBtn" title="sound on/off">🔊</button>
<div id="hint">click anywhere in the sky for more fireworks ✨</div>

<script>
"use strict";

/* ============================== SETUP ============================== */
const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
const trail = document.createElement("canvas");      // additive particle layer
const tctx = trail.getContext("2d");
const bg = document.createElement("canvas");          // static Paris backdrop
const bgctx = bg.getContext("2d");

const TAU = Math.PI * 2;
let W = 0, H = 0;
let tower = null;          // painted-tower geometry (sparkle effect); null in photo mode
let started = false;
let frame = 0;
let flashA = 0;            // sky flash from explosions, lights the whole scene
let wind = 0.006;

const urlName = new URLSearchParams(location.search).get("name");
const NAME = (urlName && urlName.trim()) ? urlName.trim() : CONFIG.name;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[(Math.random() * arr.length) | 0];

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function emberOf(hex) {   // what the spark cools down to: dim orange-red
  const [r, g, b] = hexToRgb(hex);
  const m = t => Math.round(t);
  return `rgb(${m(r * 0.4 + 255 * 0.6 * 0.9)},${m(g * 0.4 + 80 * 0.6)},${m(b * 0.4 + 20 * 0.6)})`;
}

function resize() {
  W = canvas.width = trail.width = bg.width = window.innerWidth;
  H = canvas.height = trail.height = bg.height = window.innerHeight;
  buildBackground();
}
window.addEventListener("resize", resize);

/* ======================= BACKGROUND (PHOTO) ======================== */
let photo = null;
(() => {
  const candidates = [...new Set([CONFIG.backgroundImage, window.EMBEDDED_PHOTO, "parisphoto.png", "paris.jpg", "paris.png", "paris.jpeg"].filter(Boolean))];
  let i = 0;
  const tryNext = () => {
    if (i >= candidates.length) return;    // no photo found → painted fallback
    const img = new Image();
    img.onload = () => { photo = img; buildBackground(); };
    img.onerror = () => { i++; tryNext(); };
    img.src = candidates[i];
  };
  tryNext();
})();

function buildBackground() {
  if (photo) {
    tower = null;
    // cover-fit the photo
    const s = Math.max(W / photo.width, H / photo.height);
    const dw = photo.width * s, dh = photo.height * s;
    bgctx.drawImage(photo, (W - dw) / 2, (H - dh) / 2, dw, dh);
    // gently deepen the sky so the fireworks pop
    const g = bgctx.createLinearGradient(0, 0, 0, H * 0.6);
    g.addColorStop(0, "rgba(2,2,12,.38)");
    g.addColorStop(1, "rgba(2,2,12,0)");
    bgctx.fillStyle = g;
    bgctx.fillRect(0, 0, W, H * 0.6);
    // subtle vignette
    const v = bgctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75);
    v.addColorStop(0, "rgba(0,0,0,0)");
    v.addColorStop(1, "rgba(0,0,8,.35)");
    bgctx.fillStyle = v;
    bgctx.fillRect(0, 0, W, H);
    return;
  }
  paintParisFallback();
}

/* ================= PAINTED PARIS (fallback, no photo) ============== */
let stars = [];

function paintParisFallback() {
  const g = bgctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0.00, "#030308");
  g.addColorStop(0.35, "#0a0c24");
  g.addColorStop(0.70, "#1b1436");
  g.addColorStop(0.88, "#33203f");
  g.addColorStop(1.00, "#0a0710");
  bgctx.fillStyle = g;
  bgctx.fillRect(0, 0, W, H);

  stars = [];
  for (let i = 0; i < 230; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.72, r: rnd(0.3, 1.3), ph: Math.random() * TAU, sp: rnd(0.008, 0.03) });
  }

  const mx = W * 0.82, my = H * 0.14, mr = Math.min(W, H) * 0.045;
  let mg = bgctx.createRadialGradient(mx, my, mr * 0.3, mx, my, mr * 5);
  mg.addColorStop(0, "rgba(255,250,230,.30)");
  mg.addColorStop(1, "rgba(255,250,230,0)");
  bgctx.fillStyle = mg;
  bgctx.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
  bgctx.fillStyle = "#f6f1dc";
  bgctx.beginPath(); bgctx.arc(mx, my, mr, 0, TAU); bgctx.fill();
  bgctx.fillStyle = "#0a0c24";
  bgctx.beginPath(); bgctx.arc(mx - mr * 0.42, my - mr * 0.18, mr * 0.92, 0, TAU); bgctx.fill();

  const horizon = H * 0.88;

  let hg = bgctx.createLinearGradient(0, horizon - H * 0.18, 0, horizon);
  hg.addColorStop(0, "rgba(255,140,60,0)");
  hg.addColorStop(1, "rgba(255,150,70,.16)");
  bgctx.fillStyle = hg;
  bgctx.fillRect(0, horizon - H * 0.18, W, H * 0.18);

  bgctx.fillStyle = "#0b0916";
  let x = 0;
  while (x < W) {
    const bw = rnd(28, 85), bh = rnd(H * 0.03, H * 0.10);
    bgctx.fillRect(x, horizon - bh, bw, bh);
    for (let wx = x + 4; wx < x + bw - 4; wx += 7) {
      for (let wy = horizon - bh + 4; wy < horizon - 4; wy += 9) {
        if (Math.random() < 0.28) {
          bgctx.fillStyle = Math.random() < 0.8 ? "rgba(255,190,90,.75)" : "rgba(180,210,255,.6)";
          bgctx.fillRect(wx, wy, 2.2, 3.2);
        }
      }
    }
    bgctx.fillStyle = "#0b0916";
    x += bw + rnd(2, 14);
  }

  drawEiffelTower(horizon);

  const gg = bgctx.createLinearGradient(0, horizon, 0, H);
  gg.addColorStop(0, "#070510");
  gg.addColorStop(1, "#02020a");
  bgctx.fillStyle = gg;
  bgctx.fillRect(0, horizon, W, H - horizon);

  const rx = W * 0.5;
  let rg = bgctx.createLinearGradient(0, horizon, 0, H);
  rg.addColorStop(0, "rgba(255,180,80,.20)");
  rg.addColorStop(1, "rgba(255,180,80,0)");
  bgctx.fillStyle = rg;
  bgctx.beginPath();
  bgctx.moveTo(rx - tower.halfBase * 1.1, horizon);
  bgctx.lineTo(rx + tower.halfBase * 1.1, horizon);
  bgctx.lineTo(rx + tower.halfBase * 0.25, H);
  bgctx.lineTo(rx - tower.halfBase * 0.25, H);
  bgctx.fill();
}

function drawEiffelTower(baseY) {
  const h = H * 0.50;
  const cx = W * 0.5;
  const halfBase = h * 0.23, topHalf = h * 0.013;
  const prof = f => topHalf + (halfBase - topHalf) * Math.pow(1 - f, 2.3);
  tower = { cx, baseY, h, halfBase, prof };

  let glow = bgctx.createRadialGradient(cx, baseY - h * 0.35, h * 0.05, cx, baseY - h * 0.35, h * 0.95);
  glow.addColorStop(0, "rgba(255,170,70,.22)");
  glow.addColorStop(1, "rgba(255,170,70,0)");
  bgctx.fillStyle = glow;
  bgctx.fillRect(cx - h, baseY - h * 1.4, h * 2, h * 1.6);

  const t = document.createElement("canvas");
  t.width = W; t.height = H;
  const c = t.getContext("2d");

  c.beginPath();
  c.moveTo(cx - prof(0), baseY);
  for (let f = 0; f <= 1.001; f += 0.02) c.lineTo(cx - prof(f), baseY - f * h);
  for (let f = 1; f >= -0.001; f -= 0.02) c.lineTo(cx + prof(f), baseY - f * h);
  c.closePath();
  c.fillStyle = "#241505";
  c.fill();

  c.globalCompositeOperation = "destination-out";
  c.beginPath();
  c.ellipse(cx, baseY + h * 0.005, h * 0.105, h * 0.085, 0, Math.PI, 0);
  c.lineTo(cx + h * 0.105, baseY + 1);
  c.lineTo(cx - h * 0.105, baseY + 1);
  c.closePath();
  c.fill();
  c.globalCompositeOperation = "source-over";

  c.globalCompositeOperation = "source-atop";
  const ig = c.createLinearGradient(0, baseY - h, 0, baseY);
  ig.addColorStop(0, "rgba(255,205,110,.95)");
  ig.addColorStop(0.5, "rgba(255,170,70,.85)");
  ig.addColorStop(1, "rgba(230,130,40,.9)");
  c.fillStyle = ig;
  c.fillRect(cx - halfBase - 10, baseY - h - 20, halfBase * 2 + 20, h + 22);

  c.strokeStyle = "rgba(60,30,5,.55)";
  c.lineWidth = 1;
  for (let f = 0.02; f < 1; f += 0.033) {
    const y = baseY - f * h, w = prof(f);
    c.beginPath(); c.moveTo(cx - w, y); c.lineTo(cx + w, y); c.stroke();
  }
  for (let f = 0; f < 0.95; f += 0.066) {
    const y1 = baseY - f * h, y2 = baseY - (f + 0.066) * h;
    c.beginPath();
    c.moveTo(cx - prof(f), y1); c.lineTo(cx + prof(f + 0.066), y2);
    c.moveTo(cx + prof(f), y1); c.lineTo(cx - prof(f + 0.066), y2);
    c.stroke();
  }
  c.globalCompositeOperation = "source-over";

  c.fillStyle = "#ffca70";
  for (const f of [0.19, 0.40]) {
    const w = prof(f) + h * 0.028;
    c.fillRect(cx - w, baseY - f * h - h * 0.008, w * 2, h * 0.014);
  }
  c.fillRect(cx - prof(0.97) - h * 0.012, baseY - 0.97 * h, (prof(0.97) + h * 0.012) * 2, h * 0.012);

  c.strokeStyle = "#ffca70"; c.lineWidth = 2;
  c.beginPath(); c.moveTo(cx, baseY - h); c.lineTo(cx, baseY - h * 1.07); c.stroke();
  c.fillStyle = "#fff";
  c.beginPath(); c.arc(cx, baseY - h * 1.07, 2.2, 0, TAU); c.fill();

  bgctx.drawImage(t, 0, 0);
}

/* ============================= AUDIO =============================== */
let actx = null, noiseBuf = null, soundOn = true;

function initAudio() {
  if (actx) return;
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { actx = null; }
}

function playBoom(size = 1) {
  if (!actx || !soundOn) return;
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const lp = actx.createBiquadFilter(); lp.type = "lowpass";
  lp.frequency.setValueAtTime(2200 * size, t0);
  lp.frequency.exponentialRampToValueAtTime(60, t0 + 1.1);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.55 * size, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.4);
  src.connect(lp).connect(g).connect(actx.destination);
  src.start(t0); src.stop(t0 + 1.5);
  const o = actx.createOscillator(); o.frequency.setValueAtTime(70, t0);
  o.frequency.exponentialRampToValueAtTime(28, t0 + 0.5);
  const og = actx.createGain();
  og.gain.setValueAtTime(0.5 * size, t0);
  og.gain.exponentialRampToValueAtTime(0.001, t0 + 0.6);
  o.connect(og).connect(actx.destination);
  o.start(t0); o.stop(t0 + 0.65);
  // crackling sputter after the boom
  for (let i = 0; i < 8 * size; i++) {
    const tc = t0 + rnd(0.25, 1.3);
    const cs = actx.createBufferSource(); cs.buffer = noiseBuf;
    cs.playbackRate.value = rnd(0.8, 1.6);
    const hp = actx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 3000;
    const cg = actx.createGain();
    cg.gain.setValueAtTime(rnd(0.01, 0.05) * size, tc);
    cg.gain.exponentialRampToValueAtTime(0.001, tc + 0.05);
    cs.connect(hp).connect(cg).connect(actx.destination);
    cs.start(tc, rnd(0, 1)); cs.stop(tc + 0.06);
  }
}

function playWhoosh() {
  if (!actx || !soundOn) return;
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.Q.value = 6;
  bp.frequency.setValueAtTime(300, t0);
  bp.frequency.exponentialRampToValueAtTime(1600, t0 + 1.0);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.25);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.1);
  src.connect(bp).connect(g).connect(actx.destination);
  src.start(t0); src.stop(t0 + 1.2);
}

document.getElementById("soundBtn").addEventListener("click", e => {
  e.stopPropagation();
  soundOn = !soundOn;
  e.currentTarget.textContent = soundOn ? "🔊" : "🔇";
});

/* ========================= SHAPE SAMPLING ========================== */
function getTextPoints(text) {
  const fs = 160;
  const off = document.createElement("canvas");
  const c = off.getContext("2d");
  c.font = `900 ${fs}px Arial, sans-serif`;
  const tw = Math.ceil(c.measureText(text).width);
  off.width = tw + 40; off.height = fs * 1.6;
  const c2 = off.getContext("2d");
  c2.font = `900 ${fs}px Arial, sans-serif`;
  c2.fillStyle = "#fff";
  c2.textBaseline = "middle";
  c2.fillText(text, 20, off.height / 2);

  const img = c2.getImageData(0, 0, off.width, off.height).data;
  const raw = [];
  for (let y = 0; y < off.height; y += 4) {
    for (let x = 0; x < off.width; x += 4) {
      if (img[(y * off.width + x) * 4 + 3] > 128) raw.push([x, y]);
    }
  }
  const scale = Math.min((W * 0.86) / off.width, (H * 0.20) / fs);
  const cx = W / 2, cy = H * 0.24;
  const keep = Math.min(1, 1400 / raw.length);
  const pts = [];
  for (const [x, y] of raw) {
    if (Math.random() > keep) continue;
    pts.push([cx + (x - off.width / 2) * scale, cy + (y - off.height / 2) * scale]);
  }
  return pts;
}

function getHeartPoints() {
  const cx = W / 2, cy = H * 0.28;
  const s = Math.min(W, H) * 0.017;
  const pts = [];
  for (const [scale, n] of [[1, 320], [0.72, 200], [0.46, 130], [0.22, 70]]) {
    for (let i = 0; i < n; i++) {
      const t = (i / n) * TAU;
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      pts.push([cx + x * s * scale, cy - y * s * scale]);
    }
  }
  for (let i = 0; i < 120; i++) {
    const t = Math.random() * TAU, sc = Math.random() * 0.9;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    pts.push([cx + x * s * sc, cy - y * s * sc]);
  }
  return pts;
}

/* =========================== PARTICLES ============================= */
const particles = [];
const rockets = [];
const smoke = [];
const MAX_PARTICLES = 3400;

class Smoke {
  constructor(x, y) {
    this.x = x + rnd(-20, 20); this.y = y + rnd(-15, 15);
    this.r = rnd(18, 42);
    this.alpha = rnd(0.05, 0.1);
    this.vx = rnd(-0.15, 0.15) + wind * 20;
    this.vy = rnd(-0.35, -0.1);
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.r *= 1.006;
    this.alpha *= 0.992;
    return this.alpha > 0.006;
  }
  draw() {   // drawn on the MAIN canvas (not additive) so it dims the sky
    const g = ctx.createRadialGradient(this.x, this.y, this.r * 0.2, this.x, this.y, this.r);
    g.addColorStop(0, `rgba(120,115,120,${this.alpha})`);
    g.addColorStop(1, "rgba(120,115,120,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, TAU); ctx.fill();
  }
}

class Spark {
  /* opts: color, size, decay, gravity, drag, trailer, strobe, crackle */
  constructor(x, y, angle, speed, o) {
    this.x = this.px = x; this.y = this.py = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.color = o.color;
    this.ember = o.ember || emberOf(o.color);
    this.size = o.size || 1.4;
    this.alpha = 1;
    this.decay = o.decay || 0.012;
    this.gravity = o.gravity !== undefined ? o.gravity : 0.035;
    this.drag = o.drag || 0.985;
    this.trailer = !!o.trailer;
    this.strobe = !!o.strobe;
    this.crackle = !!o.crackle;
    this.age = 0;
    this.seed = (Math.random() * 100) | 0;
  }
  update() {
    this.age++;
    this.px = this.x; this.py = this.y;
    this.vx = this.vx * this.drag + wind;
    this.vy = this.vy * this.drag + this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    // heavy flicker near burn-out, like a real ember sputtering
    this.alpha -= this.decay * (this.alpha < 0.5 && Math.random() < 0.12 ? 4 : 1);

    if (this.trailer && this.age > 4 && Math.random() < 0.32 && particles.length < MAX_PARTICLES) {
      particles.push(new Spark(this.x, this.y, Math.random() * TAU, rnd(0.05, 0.3), {
        color: this.color, ember: this.ember, size: this.size * 0.45,
        decay: rnd(0.04, 0.08), gravity: 0.012, drag: 0.99,
      }));
    }
    if (this.crackle && this.alpha < 0.4 && Math.random() < 0.05) {
      for (let i = 0; i < 5; i++) {
        particles.push(new Spark(this.x, this.y, Math.random() * TAU, rnd(0.6, 2.6), {
          color: "#fff6d8", size: 0.7, decay: rnd(0.05, 0.1), gravity: 0.02, drag: 0.97,
        }));
      }
      return false;   // the spark pops apart
    }
    return this.alpha > 0.02;
  }
  draw() {
    if (this.strobe && (frame + this.seed) % 7 < 4) return;   // blinking strobe stars
    const a = this.alpha * (0.8 + Math.random() * 0.2);
    // white-hot when newborn, true color mid-life, dim ember at the end
    const col = this.age < 5 ? "#ffffff" : (this.alpha > 0.45 ? this.color : this.ember);
    tctx.globalAlpha = a;
    tctx.strokeStyle = col;
    tctx.lineWidth = this.size;
    tctx.beginPath(); tctx.moveTo(this.px, this.py); tctx.lineTo(this.x, this.y); tctx.stroke();
    tctx.globalAlpha = a * 0.22;
    tctx.fillStyle = col;
    tctx.beginPath(); tctx.arc(this.x, this.y, this.size * 2.6, 0, TAU); tctx.fill();
  }
}

class ShapeParticle {
  constructor(x, y, tx, ty, color, holdFrames) {
    this.x = this.px = x; this.y = this.py = y;
    this.sx = x; this.sy = y;
    this.tx = tx + rnd(-1.5, 1.5); this.ty = ty + rnd(-1.5, 1.5);
    this.color = color;
    this.ember = emberOf(color);
    this.size = rnd(1.4, 2.4);
    this.alpha = 1;
    this.t = 0;
    this.flyFrames = rnd(55, 85) | 0;
    this.hold = holdFrames + rnd(-30, 50);
    this.drift = rnd(-1, 1);
    this.state = "fly";
    this.vx = 0; this.vy = 0;
  }
  update() {
    this.t++;
    this.px = this.x; this.py = this.y;
    if (this.state === "fly") {
      const p = Math.min(1, this.t / this.flyFrames);
      const e = 1 - Math.pow(1 - p, 4);
      this.x = this.sx + (this.tx - this.sx) * e + Math.sin(this.t * 0.3 + this.drift * 9) * (1 - e) * 6;
      this.y = this.sy + (this.ty - this.sy) * e + Math.cos(this.t * 0.27 + this.drift * 7) * (1 - e) * 6;
      if (p >= 1) this.state = "hold";
    } else if (this.state === "hold") {
      this.x = this.tx + Math.sin(this.t * 0.11 + this.drift * 10) * 0.7;
      this.y = this.ty + Math.cos(this.t * 0.09 + this.drift * 12) * 0.7;
      if (this.t > this.flyFrames + this.hold) {
        this.state = "fall";
        this.vx = rnd(-0.4, 0.4);
        this.vy = rnd(-0.3, 0.2);
      }
    } else {
      this.vy += 0.028;
      this.vx = this.vx * 0.99 + wind;
      this.x += this.vx;
      this.y += this.vy;
      this.alpha -= 0.011 * (Math.random() < 0.1 ? 3 : 1);
    }
    return this.alpha > 0.02;
  }
  draw() {
    const tw = 0.7 + 0.3 * Math.sin(this.t * 0.25 + this.drift * 20);
    const a = this.alpha * tw;
    const col = this.t < 8 ? "#ffffff" : (this.state === "fall" && this.alpha < 0.45 ? this.ember : this.color);
    if (this.state === "fly" || this.state === "fall") {
      tctx.globalAlpha = a;
      tctx.strokeStyle = col;
      tctx.lineWidth = this.size;
      tctx.beginPath(); tctx.moveTo(this.px, this.py); tctx.lineTo(this.x, this.y); tctx.stroke();
    } else {
      tctx.globalAlpha = a;
      tctx.fillStyle = col;
      tctx.beginPath(); tctx.arc(this.x, this.y, this.size, 0, TAU); tctx.fill();
    }
    tctx.globalAlpha = a * 0.3;
    tctx.fillStyle = col;
    tctx.beginPath(); tctx.arc(this.x, this.y, this.size * 2.6, 0, TAU); tctx.fill();
    if (this.state === "hold" && Math.random() < 0.02) {
      tctx.globalAlpha = Math.min(1, a * 1.5);
      tctx.fillStyle = "#ffffff";
      tctx.beginPath(); tctx.arc(this.x, this.y, this.size * 0.8, 0, TAU); tctx.fill();
    }
  }
}

class Rocket {
  constructor(x, ty, onExplode, big) {
    this.x = x + rnd(-15, 15);
    this.y = H + 10;
    this.ty = ty;
    this.dur = big ? rnd(75, 85) : rnd(60, 75);
    this.t = 0;
    this.sy = this.y;
    this.px = this.x; this.py = this.y;
    this.wob = rnd(0, TAU);
    this.onExplode = onExplode;
    playWhoosh();
  }
  update() {
    this.t++;
    this.px = this.x; this.py = this.y;
    const p = Math.min(1, this.t / this.dur);
    const e = 1 - Math.pow(1 - p, 2.4);
    this.y = this.sy + (this.ty - this.sy) * e;
    this.x += Math.sin(this.t * 0.2 + this.wob) * 0.45;
    if (Math.random() < 0.9) {
      particles.push(new Spark(this.x + rnd(-1, 1), this.y + 4, Math.PI / 2 + rnd(-0.3, 0.3), rnd(0.5, 1.8), {
        color: "#ffb055", size: rnd(0.5, 1.1), decay: 0.06, gravity: 0.01, drag: 0.98,
      }));
    }
    if (p >= 1) { this.onExplode(this.x, this.y); return false; }
    return true;
  }
  draw() {
    tctx.globalAlpha = 1;
    tctx.strokeStyle = "#fff4d6";
    tctx.lineWidth = 2;
    tctx.beginPath(); tctx.moveTo(this.px, this.py); tctx.lineTo(this.x, this.y); tctx.stroke();
    tctx.globalAlpha = 0.35;
    tctx.fillStyle = "#ffd9a0";
    tctx.beginPath(); tctx.arc(this.x, this.y, 4, 0, TAU); tctx.fill();
  }
}

function flash(x, y, r, color) {
  const g = tctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(255,255,255,0)");
  tctx.globalAlpha = 0.55;
  tctx.fillStyle = g;
  tctx.beginPath(); tctx.arc(x, y, r, 0, TAU); tctx.fill();
  tctx.globalAlpha = 1;
}

function burstEffects(x, y, power) {
  flash(x, y, 90 + 90 * power, "#fff8ec");
  flashA = Math.min(0.32, flashA + 0.09 * power);   // light up the whole scene
  const n = Math.round(3 + 4 * power);
  for (let i = 0; i < n; i++) smoke.push(new Smoke(x, y));
  playBoom(Math.min(1.5, 0.4 + 0.5 * power));
}

/* ==================== REAL FIREWORK SHELL TYPES ==================== */
const AMBIENT_PALETTES = [
  ["#8ecae6", "#48cae4", "#caf0f8"],
  ["#c77dff", "#e0aaff", "#9d4edd"],
  ["#80ed99", "#57cc99", "#c7f9cc"],
  ["#ffd166", "#ffe29a", "#fca311"],
  ["#ff8fab", "#ffb3c6", "#ff5d8f"],
  ["#f1f1f1", "#ffe8d6", "#bde0fe"],
];
const SHELL_TYPES = ["peony", "chrys", "willow", "palm", "ring", "strobe", "crossette"];

function explodeShell(x, y, power, forcedType) {
  const type = forcedType || pick(SHELL_TYPES);
  const pal = pick(AMBIENT_PALETTES);
  burstEffects(x, y, power);

  const room = () => particles.length < MAX_PARTICLES;

  if (type === "peony" || type === "chrys") {
    const n = Math.round((type === "chrys" ? 90 : 130) * power);
    for (let i = 0; i < n && room(); i++) {
      const sp = rnd(1, 7 * power) * (0.55 + 0.45 * Math.sqrt(Math.random()));
      particles.push(new Spark(x, y, Math.random() * TAU, sp, {
        color: pick(pal), size: rnd(1, 1.9),
        decay: rnd(0.008, 0.016), trailer: type === "chrys",
      }));
    }
  } else if (type === "willow") {
    const gold = ["#ffd97a", "#ffca55", "#ffe6a8"];
    const n = Math.round(90 * power);
    for (let i = 0; i < n && room(); i++) {
      particles.push(new Spark(x, y, Math.random() * TAU, rnd(1.5, 5.5 * power), {
        color: pick(gold), size: rnd(1, 1.6),
        decay: rnd(0.003, 0.006), gravity: 0.022, drag: 0.99, trailer: true,
      }));
    }
  } else if (type === "palm") {
    const gold = ["#ffc95e", "#ffe08a"];
    const n = Math.round(12 * power) + 6;
    for (let i = 0; i < n && room(); i++) {
      particles.push(new Spark(x, y, Math.random() * TAU, rnd(4, 7.5) * power, {
        color: pick(gold), size: rnd(2.4, 3.4),
        decay: rnd(0.007, 0.012), gravity: 0.045, drag: 0.985, trailer: true,
      }));
    }
  } else if (type === "ring") {
    const col = pick(pal);
    const n = Math.round(70 * power);
    const tilt = rnd(0.35, 1);
    const rot = rnd(0, Math.PI);
    for (let i = 0; i < n && room(); i++) {
      const th = (i / n) * TAU;
      let ux = Math.cos(th), uy = Math.sin(th) * tilt;
      const rx = ux * Math.cos(rot) - uy * Math.sin(rot);
      const ry = ux * Math.sin(rot) + uy * Math.cos(rot);
      const sp = rnd(4.4, 5) * power;
      particles.push(new Spark(x, y, Math.atan2(ry, rx), Math.hypot(rx, ry) * sp, {
        color: col, size: rnd(1.2, 1.8), decay: rnd(0.009, 0.014),
      }));
    }
  } else if (type === "strobe") {
    const n = Math.round(100 * power);
    for (let i = 0; i < n && room(); i++) {
      particles.push(new Spark(x, y, Math.random() * TAU, rnd(0.8, 5 * power), {
        color: Math.random() < 0.5 ? "#fdfdff" : "#ffe9b8", size: rnd(1.2, 2),
        decay: rnd(0.004, 0.008), gravity: 0.02, drag: 0.988, strobe: true,
      }));
    }
  } else {  // crossette — sparks that split with a crack
    const n = Math.round(36 * power);
    for (let i = 0; i < n && room(); i++) {
      particles.push(new Spark(x, y, Math.random() * TAU, rnd(2, 6 * power), {
        color: pick(pal), size: rnd(1.4, 2.2),
        decay: rnd(0.008, 0.013), crackle: true,
      }));
    }
  }
}

function ambientFirework(x, y, small, type) {
  rockets.push(new Rocket(x, y, (ex, ey) => explodeShell(ex, ey, small ? 0.55 : 1, type), false));
}

function shapeFirework(points, palette, holdSeconds) {
  const cx = points.reduce((s, p) => s + p[0], 0) / points.length;
  const cy = points.reduce((s, p) => s + p[1], 0) / points.length;
  rockets.push(new Rocket(cx, cy, (ex, ey) => {
    burstEffects(ex, ey, 1.6);
    flash(ex, ey, 240, "#ffffff");
    const hold = holdSeconds * 60;
    for (const [tx, ty] of points) {
      particles.push(new ShapeParticle(ex, ey, tx, ty, pick(palette), hold));
    }
    for (let i = 0; i < 80 && particles.length < MAX_PARTICLES; i++) {
      particles.push(new Spark(ex, ey, Math.random() * TAU, rnd(2, 9), {
        color: pick(palette), size: rnd(0.8, 1.6), decay: rnd(0.012, 0.022), trailer: i % 3 === 0,
      }));
    }
  }, true));
}

/* ============================ DIRECTOR ============================= */
let showFrame = 0;
let show = null;

function buildShow() {
  const nameFade = CONFIG.nameHoldSeconds + 3.5;
  const tName = 2.6;
  const tHeart = tName + 1.3 + nameFade + 1.2;
  const tFinale = tHeart + 1.3 + CONFIG.heartHoldSeconds + 3.2;
  const ev = [
    { t: 0.4, fn: () => ambientFirework(W * rnd(0.12, 0.3), H * rnd(0.25, 0.4)) },
    { t: 1.2, fn: () => ambientFirework(W * rnd(0.7, 0.88), H * rnd(0.22, 0.38)) },
    { t: 2.0, fn: () => ambientFirework(W * rnd(0.4, 0.6), H * rnd(0.18, 0.3)) },
    { t: tName, fn: () => shapeFirework(getTextPoints(NAME), CONFIG.namePalette, CONFIG.nameHoldSeconds) },
    { t: tName + 3.5, fn: () => ambientFirework(W * 0.12, H * 0.42, true) },
    { t: tName + 5.5, fn: () => ambientFirework(W * 0.88, H * 0.4, true) },
    { t: tHeart, fn: () => shapeFirework(getHeartPoints(), CONFIG.heartPalette, CONFIG.heartHoldSeconds) },
    { t: tHeart + 3.0, fn: () => ambientFirework(W * 0.14, H * 0.45, true) },
    { t: tHeart + 4.5, fn: () => ambientFirework(W * 0.86, H * 0.43, true) },
  ];
  for (let i = 0; i < 7; i++) {
    ev.push({ t: tFinale + i * 0.5, fn: () => ambientFirework(W * rnd(0.15, 0.85), H * rnd(0.15, 0.42)) });
  }
  ev.push({ t: tFinale + 3.6, fn: () => ambientFirework(W * 0.5, H * 0.2, false, "willow") });
  const loopAt = tFinale + 7.5;
  return { ev, loopAt };
}

function directorTick() {
  if (!show) { show = buildShow(); showFrame = 0; show.ev.forEach(e => e.done = false); }
  const el = showFrame / 60;   // frame-based: the show pauses when the tab is hidden
  showFrame++;
  for (const e of show.ev) {
    if (!e.done && el >= e.t) { e.done = true; e.fn(); }
  }
  if (el >= show.loopAt) show = null;
}

/* ============================ MAIN LOOP ============================ */
function loop() {
  requestAnimationFrame(loop);
  frame++;
  wind = Math.sin(frame * 0.001) * 0.01;   // slowly shifting breeze

  ctx.drawImage(bg, 0, 0);

  if (!photo) {
    ctx.fillStyle = "#fff";
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(s.ph + frame * s.sp));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (tower) {
      ctx.fillStyle = "#fff";
      for (let i = 0; i < 9; i++) {
        const f = Math.random();
        const w = tower.prof(f);
        ctx.globalAlpha = rnd(0.3, 1);
        ctx.fillRect(tower.cx + rnd(-w, w), tower.baseY - f * tower.h, 1.4, 1.4);
      }
      ctx.globalAlpha = 1;
      if ((frame % 120) < 12) {
        const g = ctx.createRadialGradient(tower.cx, tower.baseY - tower.h * 1.07, 0, tower.cx, tower.baseY - tower.h * 1.07, 14);
        g.addColorStop(0, "rgba(255,255,255,.9)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(tower.cx, tower.baseY - tower.h * 1.07, 14, 0, TAU); ctx.fill();
      }
    }
  }

  // explosion light washing over the whole scene
  if (flashA > 0.004) {
    ctx.fillStyle = `rgba(255,224,178,${flashA.toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
    flashA *= 0.86;
  }

  // drifting smoke (dims the sky, non-additive)
  for (let i = smoke.length - 1; i >= 0; i--) {
    if (smoke[i].update()) smoke[i].draw();
    else smoke.splice(i, 1);
  }

  if (started) directorTick();

  tctx.globalCompositeOperation = "destination-out";
  tctx.fillStyle = "rgba(0,0,0,0.13)";
  tctx.fillRect(0, 0, W, H);
  tctx.globalCompositeOperation = "lighter";
  tctx.lineCap = "round";

  for (let i = rockets.length - 1; i >= 0; i--) {
    if (rockets[i].update()) rockets[i].draw();
    else rockets.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    if (particles[i].update()) particles[i].draw();
    else particles.splice(i, 1);
  }
  tctx.globalAlpha = 1;
  tctx.globalCompositeOperation = "source-over";

  ctx.drawImage(trail, 0, 0);
}

/* ============================== START ============================== */
const overlay = document.getElementById("overlay");
overlay.addEventListener("click", () => {
  if (started) return;
  started = true;
  initAudio();
  overlay.classList.add("hidden");
});

canvas.addEventListener("click", e => {
  if (!started) return;
  ambientFirework(e.clientX, Math.min(e.clientY, H * 0.6));
});

resize();
requestAnimationFrame(loop);
</script>
